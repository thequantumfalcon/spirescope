version: 2
updates:
  # The release workflows build and publish executables that users download, so
  # a compromised or vulnerable action is a supply-chain problem for them, not
  # just for CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # The Dockerfile pins python:3.12-slim by digest. Without this entry that
  # digest only moved when someone remembered to re-resolve it, so the image
  # kept building on the 3.12-slim of that day and missed the upstream
  # rebuilds that carry Debian and CPython security fixes.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
    ignore:
      # Digest refreshes within 3.12 only. requirements-runtime-lock.txt is
      # resolved for Python 3.12, so moving the image to 3.13-slim is a
      # deliberate change (re-lock, re-qualify), not a monthly bump.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # No pip-compile .in file may exist anywhere in the repository, and no lock
  # may name one in its annotations: Dependabot finds it either way and then
  # treats requirements-lock.txt as pip-compile output it cannot regenerate,
  # so it stops updating that lock and opens partial PRs that fail the
  # lock-agreement tests (2026-10-10). tests/test_release_pipeline.py guards
  # this; requirements-ci-lock.txt documents how to recompile without one.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      dev-dependencies:
        patterns:
          - pytest*
          - ruff
          - mypy
    ignore:
      # pydantic pins pydantic-core exactly -- pydantic 2.13.4 requires
      # pydantic-core==2.46.4 -- so a standalone bump can never resolve.
      # PR #34 (2.46.4 -> 2.48.0) failed every job that installs the lock,
      # pip-audit included, with ResolutionImpossible. requirements-lock.txt is
      # pip-compile output, so pydantic-core is a resolved artifact rather than
      # a declared dependency: it moves only when pydantic moves, and the lock
      # is regenerated then. Without this the same unmergeable PR returns every
      # month and masks real audit failures behind a permanently red job.
      - dependency-name: "pydantic-core"
