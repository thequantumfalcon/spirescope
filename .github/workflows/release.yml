name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Build executable
        run: python -m PyInstaller spirescope.spec --clean --noconfirm

      - name: Strip dist-info metadata
        run: |
          Get-ChildItem -Path dist/Spirescope -Recurse -Filter "*.dist-info" -Directory | Remove-Item -Recurse -Force
        shell: pwsh

      - name: Copy distribution README
        run: |
          if (Test-Path README_DIST.txt) { Copy-Item README_DIST.txt dist/Spirescope/README.txt }
        shell: pwsh

      - name: Smoke-test the built app
        # Rule: validate the artifact users receive, not just the source tree.
        # Packaging silently drops files the dev env has (issue #5: locales
        # were missing, so every nav item rendered as "nav.cards").
        run: |
          $env:STS2_PORT = "8899"
          $env:SPIRESCOPE_CHECK_UPDATES = "0"
          $proc = Start-Process -FilePath "dist\Spirescope\Spirescope.exe" -ArgumentList "serve","--no-browser" -PassThru
          $html = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try { $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8899/" -UseBasicParsing).Content; break } catch {}
          }
          if (-not $html) { Stop-Process -Id $proc.Id -Force; throw "app did not start" }
          # i18n-exclusive assertion: this placeholder only exists when a
          # locale file resolved. Plain words like "Cards" also appear in
          # hardcoded page content, so they pass even on a broken build.
          if ($html -notmatch 'placeholder="Search cards') { Stop-Process -Id $proc.Id -Force; throw "i18n strings did not resolve in the packaged build" }
          if ($html -match '>(nav|common|settings)\.[a-z_]+<') { Stop-Process -Id $proc.Id -Force; throw "raw i18n keys rendered in the packaged build" }
          Invoke-WebRequest -Uri "http://127.0.0.1:8899/cards" -UseBasicParsing | Out-Null
          Invoke-WebRequest -Uri "http://127.0.0.1:8899/settings" -UseBasicParsing | Out-Null
          Write-Host "smoke test passed: real strings rendered, key pages 200"
          Stop-Process -Id $proc.Id -Force
        shell: pwsh

      - name: Create zip archives
        run: |
          Compress-Archive -Path dist/Spirescope -DestinationPath dist/Spirescope-${{ github.ref_name }}-windows.zip
          Copy-Item dist/Spirescope-${{ github.ref_name }}-windows.zip dist/Spirescope-windows.zip
        shell: pwsh

      - name: Create SHA-256 checksums
        run: |
          $tagZip = "dist/Spirescope-${{ github.ref_name }}-windows.zip"
          $latestZip = "dist/Spirescope-windows.zip"
          foreach ($path in @($tagZip, $latestZip)) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $path -Leaf
            # LF line ending — Set-Content writes CRLF, which breaks
            # `shasum -c` / `sha256sum -c` on the resulting file
            [System.IO.File]::WriteAllText("$path.sha256", "$hash  $name`n")
          }
        shell: pwsh

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          python -c "
          import re, os
          tag = os.environ['TAG']
          version = tag.lstrip('v')
          with open('CHANGELOG.md', encoding='utf-8') as f:
              text = f.read()
          # Extract section for this version
          pattern = rf'## v{re.escape(version)}\n(.*?)(?=\n## v|\Z)'
          m = re.search(pattern, text, re.DOTALL)
          body = m.group(1).strip() if m else 'See CHANGELOG.md for details.'
          # Build full release body
          header = '<h2 align=\"center\">⚔ S P I R E S C O P E ⚔</h2>\n'
          header += '<p align=\"center\"><em>Card lookup · Deck analysis · Live run tracking · Analytics for Slay the Spire 2</em></p>\n\n---\n\n'
          header += f'## What\'s New in {tag}\n\n'
          footer = '\n\n---\n\n### Download\n\n'
          footer += '**[Download Spirescope for Windows](https://github.com/thequantumfalcon/spirescope/releases/latest/download/Spirescope-windows.zip)**'
          footer += ' — extract the zip, open the \`Spirescope\` folder, double-click \`Spirescope.exe\`.\n\n'
          footer += 'GitHub is the only official download source. Use the release assets here and the attached checksum file.\n\n'
          footer += '**Windows may flag the download as a virus.** That is a false positive on unsigned PyInstaller apps '
          footer += '(the packaging format, not the contents). See '
          footer += '[docs/ANTIVIRUS.md](https://github.com/thequantumfalcon/spirescope/blob/master/docs/ANTIVIRUS.md) '
          footer += 'to verify the checksum yourself, allow it, or run from source instead.\n\n'
          footer += 'The versioned and unversioned zips are identical; the unversioned names exist so the latest-download URL stays stable.'
          notes = header + body + footer
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          "
        env:
          TAG: ${{ github.ref_name }}
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Spirescope-${{ github.ref_name }}-windows.zip
            dist/Spirescope-${{ github.ref_name }}-windows.zip.sha256
            dist/Spirescope-windows.zip
            dist/Spirescope-windows.zip.sha256
          body_path: RELEASE_NOTES.md
