name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check sts2/ tests/

      - name: Run tests
        id: tests
        run: |
          set +e
          output=$(pytest -q --tb=short 2>&1)
          rc=$?
          set -e
          echo "$output"
          passed=$(echo "$output" | grep -oP '\d+(?= passed)' | tail -1)
          failed=$(echo "$output" | grep -oP '\d+(?= failed)' | tail -1)
          errors=$(echo "$output" | grep -oP '\d+(?= error)' | tail -1)
          echo "passed=${passed:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed:-0}" >> "$GITHUB_OUTPUT"
          echo "errors=${errors:-0}" >> "$GITHUB_OUTPUT"
          # Honour pytest's own exit code. The summary greps drive the badge,
          # but they cannot be the gate: pytest reports collection and fixture
          # failures as "N errors", which matches neither "passed" nor
          # "failed", so a run that errored out used to leave this step green.
          exit $rc

      - name: Generate badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        run: |
          passed=${{ steps.tests.outputs.passed }}
          failed=${{ steps.tests.outputs.failed }}
          errors=${{ steps.tests.outputs.errors }}
          if [ "$failed" != "0" ] && [ -n "$failed" ]; then
            color="red"
            message="${passed} passing, ${failed} failing"
          elif [ "$errors" != "0" ] && [ -n "$errors" ]; then
            color="red"
            message="${passed} passing, ${errors} errors"
          else
            color="brightgreen"
            message="${passed} passing"
          fi
          mkdir -p badges
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${message}\",\"color\":\"${color}\"}" > badges/tests.json

      - name: Publish badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          publish_branch: badges
          destination_dir: .
          keep_files: true
          commit_message: "Update test badge"

  browser:
    # Playwright suite: the only tests that exercise the actual JS/CSS
    # (theme persistence, mobile nav, search, contrast). Separate job so a
    # browser download never slows the main matrix.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,browser]"

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run browser tests
        run: pytest -m browser -q
