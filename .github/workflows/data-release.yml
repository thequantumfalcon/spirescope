name: Data Release

on:
  push:
    tags: ["data-v*"]

permissions:
  contents: read

# Two jobs so the write-scoped token never shares a job with third-party code.
# `verify` installs the full dev lock and runs pytest -- every package in that
# lock executes there -- so it holds contents: read only. `publish` needs it,
# installs nothing, and is the only job that can create the release.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Hash-checked, as everywhere else: a lock without --require-hashes
        # pins versions but would still accept whatever bytes the index serves.
        run: |
          pip install --require-hashes -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Validate data files
        # The same validator the app ships (and the release builds run against
        # their packaged copy), rather than a third hand-kept list of required
        # files: it requires every family plus patches.json and
        # last_updated.txt, validates each record against the models, rejects
        # duplicate identities and fewer than 400 cards, and then loads the
        # set through KnowledgeBase.
        run: python -m sts2 validate-data sts2/data

      - name: Verify the tag date matches sts2/data/last_updated.txt
        # A mismatched tag means clients' local-vs-remote date comparison in
        # check_for_data_update() never resolves to "up to date", so they
        # re-offer this same bundle forever. Fail the release before it ships.
        run: |
          import os, re, sys, pathlib
          tag = os.environ["TAG"]
          m = re.fullmatch(r"data-v(\d{4})\.(\d{2})\.(\d{2})", tag)
          if not m:
              print(f"::error::tag {tag!r} is not in data-vYYYY.MM.DD form")
              sys.exit(1)
          tag_date = f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
          stamp = pathlib.Path("sts2/data/last_updated.txt").read_text(encoding="utf-8").strip()[:10]
          if tag_date != stamp:
              print(f"::error::tag date {tag_date} does not match last_updated.txt ({stamp})")
              sys.exit(1)
          print(f"tag and last_updated.txt agree: {tag_date}")
        shell: python
        env:
          TAG: ${{ github.ref_name }}

      - name: Run data pipeline tests
        run: python -m pytest tests/test_data_pipeline.py -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only this job publishes the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Python and no package installation here: tar, sha256sum and gh
      # are all on the runner image.
      - name: Package data bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          # TAG already starts with "data-", so the asset is spirescope-data-vX.Y.Z.tar.gz
          tar --exclude='data/mods' --exclude='data/.fetcher_keys.json' \
            -czf "spirescope-${TAG}.tar.gz" -C sts2 data
          sha256sum "spirescope-${TAG}.tar.gz" > "spirescope-${TAG}.sha256"
          cat "spirescope-${TAG}.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --latest=false \
            --title "Game data ${TAG#data-}" \
            --notes "Game data bundle. Installed in-app via the data-update banner, or manually: extract inside sts2/ (the tarball contains a data/ directory). See docs/DATA_MAINTENANCE.md." \
            "spirescope-${TAG}.tar.gz" "spirescope-${TAG}.sha256"
