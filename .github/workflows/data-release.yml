name: Data Release

on:
  push:
    tags: ["data-v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate data files
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          data = pathlib.Path("sts2/data")
          required = ["cards.json", "relics.json", "potions.json", "enemies.json",
                      "events.json", "epochs.json", "patches.json", "last_updated.txt"]
          for name in required:
              path = data / name
              if not path.exists():
                  sys.exit(f"Missing {name}")
              if name.endswith(".json"):
                  json.loads(path.read_text(encoding="utf-8"))
          cards = json.loads((data / "cards.json").read_text(encoding="utf-8"))
          if len(cards) < 400:
              sys.exit(f"cards.json suspiciously small ({len(cards)})")
          print(f"OK: {len(cards)} cards")
          EOF

      - name: Verify the tag date matches sts2/data/last_updated.txt
        # A mismatched tag means clients' local-vs-remote date comparison in
        # check_for_data_update() never resolves to "up to date", so they
        # re-offer this same bundle forever. Fail the release before it ships.
        run: |
          import os, re, sys, pathlib
          tag = os.environ["TAG"]
          m = re.fullmatch(r"data-v(\d{4})\.(\d{2})\.(\d{2})", tag)
          if not m:
              print(f"::error::tag {tag!r} is not in data-vYYYY.MM.DD form")
              sys.exit(1)
          tag_date = f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
          stamp = pathlib.Path("sts2/data/last_updated.txt").read_text(encoding="utf-8").strip()[:10]
          if tag_date != stamp:
              print(f"::error::tag date {tag_date} does not match last_updated.txt ({stamp})")
              sys.exit(1)
          print(f"tag and last_updated.txt agree: {tag_date}")
        shell: python
        env:
          TAG: ${{ github.ref_name }}

      - name: Run data pipeline tests
        run: python -m pytest tests/test_data_pipeline.py -q

      - name: Package data bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          # TAG already starts with "data-", so the asset is spirescope-data-vX.Y.Z.tar.gz
          tar --exclude='data/mods' --exclude='data/.fetcher_keys.json' \
            -czf "spirescope-${TAG}.tar.gz" -C sts2 data
          sha256sum "spirescope-${TAG}.tar.gz" > "spirescope-${TAG}.sha256"
          cat "spirescope-${TAG}.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --latest=false \
            --title "Game data ${TAG#data-}" \
            --notes "Game data bundle. Installed in-app via the data-update banner, or manually: extract inside sts2/ (the tarball contains a data/ directory). See docs/DATA_MAINTENANCE.md." \
            "spirescope-${TAG}.tar.gz" "spirescope-${TAG}.sha256"
