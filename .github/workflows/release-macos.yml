name: Release (macOS)

# Separate from the Windows release so a macOS failure doesn't block Windows builds.
# macOS builds are unsigned — users must right-click > Open to bypass Gatekeeper.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Build macOS app
        run: python -m PyInstaller spirescope.spec --clean --noconfirm

      - name: Strip dist-info metadata
        run: find dist/Spirescope -name "*.dist-info" -type d -exec rm -rf {} +

      - name: Smoke-test the built app
        # Rule: validate the artifact users receive, not just the source tree.
        # Packaging silently drops files the dev env has (issue #5: locales
        # were missing, so every nav item rendered as "nav.cards").
        run: |
          cd dist/Spirescope
          STS2_PORT=8899 SPIRESCOPE_CHECK_UPDATES=0 ./Spirescope serve --no-browser &
          for i in $(seq 1 30); do
            sleep 2
            curl -sf -o /dev/null http://127.0.0.1:8899/ && break
          done
          html=$(curl -sf http://127.0.0.1:8899/)
          # i18n-exclusive assertion: this placeholder only exists when a
          # locale file resolved. Plain words like "Cards" also appear in
          # hardcoded page content, so they pass even on a broken build.
          echo "$html" | grep -q 'placeholder="Search cards' || { echo "::error::i18n strings did not resolve in the packaged build"; exit 1; }
          if echo "$html" | grep -qE '>(nav|common|settings)\.[a-z_]+<'; then
            echo "::error::raw i18n keys rendered in the packaged build"
            exit 1
          fi
          curl -sf -o /dev/null http://127.0.0.1:8899/cards
          curl -sf -o /dev/null http://127.0.0.1:8899/settings
          echo "smoke test passed: real strings rendered, key pages 200"
          pkill -f "Spirescope serve" || true

      - name: Stage distribution files
        # Runs AFTER the smoke test on purpose. Two things this fixes, both
        # verified missing from the published v3.0.3 and v3.0.4 zips:
        #
        # 1. The smoke test runs the app from dist/Spirescope, and a frozen
        #    build seeds its data dir next to the executable — so a data/
        #    directory of runtime state was being swept into the release. A
        #    fresh install re-seeds it from the bundled copy on first run, so
        #    removing it here is safe and keeps runtime state out of the zip.
        # 2. "Strip dist-info" above also deletes the bundled packages' LICENSE
        #    files, and BSD-3-Clause and Apache-2.0 both require the notice to
        #    accompany a binary redistribution. build.py does this already, but
        #    this workflow calls PyInstaller directly and never runs build.py.
        run: |
          rm -rf dist/Spirescope/data
          cp LICENSE dist/Spirescope/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/Spirescope/THIRD_PARTY_NOTICES.md
          cp README_DIST.txt dist/Spirescope/README.txt
          for f in LICENSE.txt THIRD_PARTY_NOTICES.md README.txt; do
            test -f "dist/Spirescope/$f" || { echo "::error::$f missing from the distribution"; exit 1; }
          done
          if [ -d dist/Spirescope/data ]; then
            echo "::error::runtime data/ still present in the distribution"
            exit 1
          fi
          echo "staged: LICENSE.txt, THIRD_PARTY_NOTICES.md, README.txt; runtime data/ removed"

      - name: Create zip archive
        run: |
          cd dist
          zip -r Spirescope-${{ github.ref_name }}-macos.zip Spirescope/
          cp Spirescope-${{ github.ref_name }}-macos.zip Spirescope-macos.zip
          for z in Spirescope-${{ github.ref_name }}-macos.zip Spirescope-macos.zip; do
            shasum -a 256 "$z" > "$z.sha256"
          done

      - name: Upload to existing release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Spirescope-${{ github.ref_name }}-macos.zip
            dist/Spirescope-${{ github.ref_name }}-macos.zip.sha256
            dist/Spirescope-macos.zip
            dist/Spirescope-macos.zip.sha256
